<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prompt Builder</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>

<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="title">Prompt-Builder</div>
    <label for="folder-input" class="upload-button">Select Folder</label>
    <input type="file" id="folder-input" multiple webkitdirectory style="display: none;">
  </nav>

  <!-- Main content -->
  <div class="main-content">
    <!-- Left Column: Tree -->
    <div id="tree-container" class="section tree-section" style="display: none;">
      <h2>Folder Contents</h2>
      <div id="tree-view"></div>
      
      <!-- Options -->
      <div style="margin: 10px 0; color: #FFEBC6;">
        <input type="checkbox" id="exact-tokens-chk">
        <label for="exact-tokens-chk">Request Server-Side Token Count (Optional)</label>
      </div>

      <button id="process-btn" class="process-button">Generate Prompt (Local)</button>
      <p id="process-status" style="margin-top: 5px; font-size: 0.9em; color: #FFEBC6;"></p>
    </div>

    <!-- Right Column: Prompt -->
    <div id="prompt-section" class="section prompt-section" style="display: none;">
      <h2>Generated Prompt</h2>
      <p id="prompt-stats">Words: 0 | Est. Tokens: 0</p>
      <textarea id="prompt-output" readonly></textarea>
      <button id="copy-btn" class="copy-button">Copy Prompt</button>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/scripts.js') }}"></script>
</body>

</html>
